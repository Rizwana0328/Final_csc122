{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="mb-4 text-center text-danger">Delete Item</h1>
      <p class="lead text-center">Are you sure you want to delete <strong>"{{ thingstodo.title }}"</strong>?</p>
      <form action="" method="post" class="text-center">
        {% csrf_token %}
        <button class="btn btn-danger btn-lg" type="submit">Confirm Deletion</button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'thingstodo_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
