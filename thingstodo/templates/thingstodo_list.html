{% extends "base.html" %}

{% block title %}Thingstodo{% endblock title %}

{% block content %}
<div class="container mt-5">
  {% for thingstodo in thingstodo_list %}
  <div class="card mb-4 shadow-sm">
    <div class="card-header">
      <span class="fw-bold">
        <a href="{{ thingstodo.get_absolute_url }}" class="text-decoration-none text-primary">{{ thingstodo.title }}</a>
      </span> &middot;
      <span class="text-muted">by {{ thingstodo.author }} | {{ thingstodo.date }}</span>
    </div>
    <div class="card-body">
      <p class="card-text">{{ thingstodo.body|truncatewords:30 }}</p>
    </div>
    <div class="card-footer text-center text-muted">
      <a href="{% url 'thingstodo_edit' thingstodo.pk %}" class="btn btn-warning btn-sm">Edit</a>
      <a href="{% url 'thingstodo_delete' thingstodo.pk %}" class="btn btn-danger btn-sm">Delete</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock content %}
